name: Corporate chat simulation (Telegram)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll chat and reply
        env:
          TELEGRAM_CHAT_ID_CORP: ${{ secrets.TELEGRAM_CHAT_ID_CORP }}
          TELEGRAM_BOT_TOKEN_LAWYER: ${{ secrets.TELEGRAM_BOT_TOKEN_LAWYER }}
          TELEGRAM_BOT_TOKEN_ACCOUNTANT: ${{ secrets.TELEGRAM_BOT_TOKEN_ACCOUNTANT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LAWYER_NAME: ${{ vars.LAWYER_NAME }}
          ACCOUNTANT_NAME: ${{ vars.ACCOUNTANT_NAME }}
          LAWYER_PROVIDER: ${{ vars.LAWYER_PROVIDER }}
          ACCOUNTANT_PROVIDER: ${{ vars.ACCOUNTANT_PROVIDER }}
        run: python corp_chat.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "corp-chat-bot"
          git config user.email "corp-chat-bot@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "chore: update corp chat state"
          git push
