name: Post translated crypto news to Telegram channel

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FEED_URL: ${{ vars.CHANNEL_FEED_URL || 'https://protos.com/feed/,https://www.dlnews.com/rss/,https://cryptoslate.com/feed/,https://decrypt.co/feed,https://beincrypto.com/feed/,https://www.coindesk.com/arc/outboundfeeds/rss/,https://cointelegraph.com/rss,https://bitcoinmagazine.com/feed,https://thedefiant.io/feed' }}
          STATE_FILE: data/seen_ids_channel.json
          CONTENT_STYLE: "new"
          MAX_ITEMS_PER_RUN: "1"
        run: python main.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "chore: update seen news state (channel)"
          git push
