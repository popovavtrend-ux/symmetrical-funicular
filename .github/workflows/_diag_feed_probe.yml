name: Diagnostic - probe feed URL candidates

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feedparser
        run: pip install feedparser

      - name: Probe candidate URLs
        run: |
          python3 -c "
          import feedparser
          candidates = [
              'https://www.a16z.news/feed',
              'https://www.a16z.news/rss.xml',
              'https://www.a16z.news/rss',
              'https://www.a16z.news/feed.xml',
              'https://www.a16z.news/atom.xml',
              'https://www.a16z.news/feed/',
          ]
          for url in candidates:
              parsed = feedparser.parse(url)
              status = getattr(parsed, 'status', 'n/a')
              print(f'{url} -> status={status} bozo={parsed.bozo} entries={len(parsed.entries)}')
              if parsed.entries:
                  print(f'  first entry title: {parsed.entries[0].get(\"title\")}')
              if parsed.bozo:
                  print(f'  bozo_exception: {parsed.bozo_exception}')
          "
