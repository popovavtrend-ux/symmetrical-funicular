name: Purge channel history

on:
  workflow_dispatch:
    inputs:
      max_message_id:
        description: "Highest message id to attempt deleting"
        required: false
        default: "300"

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Purge
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PURGE_MAX_MESSAGE_ID: ${{ inputs.max_message_id }}
        run: python purge_channel.py
