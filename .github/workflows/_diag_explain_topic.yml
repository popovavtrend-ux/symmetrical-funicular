name: Diagnostic - verify Claude model-fallback fix

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify explain_topic and translate_via_claude now work
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          python3 -c "
          from translate import explain_topic, translate_via_claude_explainer

          print('=== explain_topic (education pipeline) ===')
          try:
              title, explanation = explain_topic('Что такое стейкинг')
              print('OK title:', title)
              print('OK explanation:', explanation)
          except Exception as e:
              print('FAILED:', type(e).__name__, str(e))

          print('=== translate_via_claude_explainer (news pipeline) ===')
          try:
              title, summary = translate_via_claude_explainer('Bitcoin hits new high', 'Bitcoin price reached a new all-time high today amid strong institutional demand.')
              print('OK title:', title)
          except Exception as e:
              print('FAILED:', type(e).__name__, str(e))
          "
