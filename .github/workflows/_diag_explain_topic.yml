name: Diagnostic - test explain_topic on specific topics

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check API key validity and bare call details
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          python3 -c "
          import os
          print('ANTHROPIC_BASE_URL set:', bool(os.environ.get('ANTHROPIC_BASE_URL')))
          print('ANTHROPIC_API_KEY set:', bool(os.environ.get('ANTHROPIC_API_KEY')))
          print('ANTHROPIC_API_KEY prefix:', (os.environ.get('ANTHROPIC_API_KEY') or '')[:12])

          from anthropic_client import get_client
          client = get_client()

          print('=== client.models.list() ===')
          try:
              models = [m.id for m in client.models.list().data]
              print('OK, available models:', models)
          except Exception as e:
              print('FAILED:', type(e).__name__, str(e))

          print('=== raw messages.create, hardcoded model, no fallback loop ===')
          try:
              resp = client.messages.create(
                  model='claude-haiku-4-5-20251001',
                  max_tokens=20,
                  messages=[{'role': 'user', 'content': 'hi'}],
              )
              print('OK:', resp.content)
          except Exception as e:
              print('FAILED:', type(e).__name__, str(e))
              print('status_code:', getattr(e, 'status_code', None))
              print('request_id:', getattr(e, 'request_id', None))
              body = getattr(e, 'body', None)
              print('body:', body)
          "


