name: Diagnostic - MOEX currency/metal market data

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Render (no posting)
        env:
          TELEGRAM_BOT_TOKEN: x
          TELEGRAM_CHAT_ID: x
        run: |
          python3 -c "
          import json, urllib.request
          h = json.load(urllib.request.urlopen('https://iss.moex.com/iss/history/engines/currency/markets/selt/boards/CETS/securities/EUR_RUB__TOM.json?iss.meta=off&from=2026-09-20'))['history']
          for r in h['data']: print('EUR hist', dict(zip(h['columns'], r)))
          import market_data as md
          print('\n'.join(md.build_currency_section()))
          "
