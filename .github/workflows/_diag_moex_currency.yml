name: Diagnostic - MOEX currency/metal market data

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Render (no posting)
        env:
          TELEGRAM_BOT_TOKEN: x
          TELEGRAM_CHAT_ID: x
        run: |
          python3 -c "
          import market_data as md, post_market_indices_ru as ru
          print('\n'.join(md.build_currency_section())); print('---')
          print('\n'.join(md.build_metals_section())); print('---')
          print('\n'.join(ru.build_section()))
          "
