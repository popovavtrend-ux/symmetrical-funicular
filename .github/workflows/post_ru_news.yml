name: Post Russian-language crypto news to Telegram

on:
  schedule:
    - cron: "30 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FEED_URL: ${{ vars.RU_FEED_URL || 'https://incrypted.com/feed/,https://cryptocurrency.tech/feed/' }}
          STATE_FILE: data/seen_ru_ids.json
          SKIP_TRANSLATION: "true"
        run: python main.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update seen RU news state"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (another workflow pushed first) - retrying $i/5"
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::Failed to push updated state after 5 retries"
          exit 1
