name: Post morning market digest to Telegram channel

on:
  # Primary trigger: an external scheduler dispatches this at 08:00 MSK,
  # because GitHub's own cron has been starting it 4-5 hours late.
  workflow_dispatch: {}
  schedule:
    # Fallback only - if the external trigger didn't fire, post late rather
    # than not at all. daily_guard.py makes this a no-op when it already ran.
    - cron: "0 5 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post the six market posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SIGNATURE: "@freshlive101"
        run: |
          if python daily_guard.py done market_morning; then
            echo "Morning digest already posted today, skipping."
            exit 0
          fi
          # One post failing (e.g. MOEX down) shouldn't stop the rest; the
          # non-crypto scripts skip themselves on weekends.
          for script in post_market_crypto post_market_currency post_market_metals \
                        post_market_indices_world post_market_indices_ru post_market_stocks; do
            python "$script.py" || echo "::warning::$script failed"
            sleep 10
          done
          python daily_guard.py mark market_morning

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update daily post guard"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (another workflow pushed first) - retrying $i/5"
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::Failed to push updated state after 5 retries"
          exit 1
