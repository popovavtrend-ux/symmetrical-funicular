name: Post Russian-language crypto news to Telegram channel

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FEED_URL: ${{ vars.CHANNEL_RU_FEED_URL || 'https://incrypted.com/feed/,https://cryptocurrency.tech/feed/,https://forklog.com/feed/,https://ru.beincrypto.com/feed/' }}
          STATE_FILE: data/seen_ru_ids_channel.json
          SKIP_TRANSLATION: "true"
          CONTENT_STYLE: "new"
        run: python main.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "chore: update seen RU news state (channel)"
          git push
